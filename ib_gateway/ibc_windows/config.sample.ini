# QuantAda / IBC 3.24.2 通用样例；复制为 Documents\IBC\config-<实例名>.ini。
# 真实账号和密码只写入当前 Windows 用户可读的受保护副本。
IbLoginId=
IbPassword=

# 端口由每个实例自己的 Gateway 设置决定；需要覆盖时填写整数端口。
TradingMode=live
OverrideTwsApiPort=
ReadOnlyLogin=no
ReadOnlyApi=no

# IBKR Mobile/passkey 仍需人工批准；超时后重新发起登录流程。
SecondFactorDevice=
ReloginAfterSecondFactorAuthenticationTimeout=yes
SecondFactorAuthenticationTimeout=180
SecondFactorAuthenticationExitInterval=600
ExitAfterSecondFactorAuthenticationTimeout=no

# 每日自动重启并复用本周会话凭据；周日会话过期后仍可能需要完整验证。
AutoRestartTime=08:30 AM
AutoLogoffTime=
ClosedownAt=
ColdRestartTime=

# 自动化部署可接管残留会话；共享人工会话时请改为 manual。
ExistingSessionDetectedAction=primaryoverride

# 仅允许已在 Gateway API 设置中加入 TrustedIPs 的来源连接。
AcceptIncomingConnectionAction=reject
AcceptNonBrokerageAccountWarning=yes
AllowBlindTrading=no

# 默认关闭 IBC 命令服务器，避免额外暴露控制端口。
CommandServerPort=0
ControlFrom=
BindAddress=
SuppressInfoMessages=yes
