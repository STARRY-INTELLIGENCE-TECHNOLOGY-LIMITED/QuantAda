<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuantAda Command Center</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--panel2:#1c2430;--border:#303946;--text:#e6edf3;--muted:#8b98a8;--accent:#55b6ff;--accent2:#8bdbb0;--danger:#ff7d88;--shadow:0 8px 28px #0005;--radius:10px;font:14px/1.45 system-ui,-apple-system,"Segoe UI","Microsoft Yahei",sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#1e3347 0,#0d1117 38%);color:var(--text);min-height:100vh}button,input,select,textarea{font:inherit;color:inherit}button{border:1px solid var(--border);background:#202938;border-radius:7px;padding:7px 12px;cursor:pointer;transition:.15s}button:hover{border-color:var(--accent);background:#263a4e}button.primary{background:#1672b8;border-color:#2e9fe7;color:#fff}button.success{background:#1b7b57;border-color:#36bd88;color:#fff}button.danger{background:#743742;border-color:#b85c67;color:#fff}button.ghost{background:transparent;color:var(--muted)}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{width:100%;background:#0f151d;border:1px solid var(--border);border-radius:6px;padding:7px 9px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px #55b6ff22}textarea{resize:vertical;min-height:76px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.app{max-width:1600px;margin:auto;padding:18px clamp(12px,2vw,30px) 28px}.topbar{display:flex;align-items:center;gap:18px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:10px;margin-right:auto}.brand h1{font-size:18px;margin:0}.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;min-width:8px;min-height:8px;flex:0 0 8px;aspect-ratio:1;border-radius:50%;background:var(--accent2)}.dot.err{background:var(--danger)}.context{display:grid;grid-template-columns:minmax(180px,1.2fr) minmax(120px,.7fr) minmax(120px,.7fr) minmax(180px,1.3fr) auto;gap:10px;background:#121923cc;border:1px solid var(--border);padding:12px;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px}.field{display:flex;flex-direction:column;gap:4px;min-width:0}.field label,.section-title{font-size:12px;color:var(--muted);font-weight:600}.profile-actions{display:flex;gap:7px;align-items:end;white-space:nowrap}.tabs{display:flex;gap:3px;border-bottom:1px solid var(--border);margin:4px 0 14px;overflow:auto}.tab{border:none;background:transparent;border-radius:7px 7px 0 0;color:var(--muted);padding:10px 16px;white-space:nowrap}.tab.active{color:var(--text);background:var(--panel);border:1px solid var(--border);border-bottom-color:var(--panel)}.tab-panel{display:none}.tab-panel.active{display:block}.card{background:linear-gradient(160deg,#161d27ee,#131921ee);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.grid.compact{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.group{border:1px solid #27313e;border-radius:8px;padding:10px;background:#111821}.group h3{font-size:13px;margin:0 0 9px;color:#c8d4e0;display:flex;align-items:center;gap:6px}.group h3:before{content:"";display:block;width:3px;height:13px;background:var(--accent);border-radius:2px}.group .field{margin:7px 0}.hint{font-size:11px;color:var(--muted)}.check{display:flex;align-items:center;gap:8px;background:#111821;border:1px solid #27313e;padding:8px 10px;border-radius:7px;cursor:pointer}.check input{width:auto;accent-color:var(--accent)}.switches{display:flex;flex-wrap:wrap;gap:9px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.section-head h2{font-size:15px;margin:0}.section-head .tools{display:flex;gap:7px;flex-wrap:wrap}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}.command-dock{position:sticky;bottom:12px;z-index:5;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:10px;margin-top:16px;background:#0d1117e8;backdrop-filter:blur(9px);border:1px solid #3c4b5f;border-radius:var(--radius);padding:10px;box-shadow:0 12px 38px #0009}.dock-pane{min-width:0;display:flex;flex-direction:column;gap:6px}.dock-pane h3{font-size:12px;color:var(--muted);margin:0;display:flex;justify-content:space-between;align-items:center}.dock-pane textarea{height:170px;min-height:110px;white-space:pre;overflow:auto}.dock-pane pre{height:170px;min-height:110px;margin:0;overflow:auto;background:#090d12;border:1px solid #26303a;border-radius:6px;padding:9px;color:#b8d5e8;font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}.dock-actions{display:flex;gap:7px;flex-wrap:wrap}.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:8px}.warning{color:#ffd580;background:#45371955;border:1px solid #806733;padding:8px;border-radius:6px;font-size:12px}.error{color:#ffadb5;background:#51293455;border:1px solid #8e4d59;padding:8px;border-radius:6px;font-size:12px}.ok{color:#a4e5c5}.param-row{display:grid;grid-template-columns:minmax(130px,1fr) 100px minmax(100px,1fr) minmax(100px,1fr) 85px;gap:7px;align-items:center;margin:5px 0}.param-row .name{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;overflow:hidden;text-overflow:ellipsis}.param-row input{padding:5px 7px}.param-head{display:grid;grid-template-columns:minmax(130px,1fr) 100px minmax(100px,1fr) minmax(100px,1fr) 85px;gap:7px;color:var(--muted);font-size:11px;margin-bottom:4px}.result-table{width:100%;border-collapse:collapse;font-size:12px}.result-table th,.result-table td{border-bottom:1px solid #27313e;padding:7px;text-align:left}.result-table th{color:var(--muted);font-weight:600}.result-table tr.selected{background:#1a3545}.source-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:end}.mono{font:12px ui-monospace,SFMono-Regular,Consolas,monospace}.toast{position:fixed;right:18px;bottom:18px;z-index:20;background:#263448;border:1px solid #54718e;padding:9px 13px;border-radius:7px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}@media(max-width:900px){.topbar{flex-wrap:wrap;gap:10px 12px}.brand{flex:1 0 100%;margin-right:0}.platform-control{flex:1 1 220px;min-width:0}.platform-control select{width:100%;min-width:0}.language-switch{flex:1 0 100%;justify-content:flex-end}.context{grid-template-columns:repeat(2,minmax(0,1fr))}.profile-actions{grid-column:1/-1}.command-dock{grid-template-columns:1fr;position:static}}@media(max-width:520px){.app{padding:10px}.topbar{align-items:flex-start;gap:8px}.platform-control{flex-basis:100%}.language-switch{justify-content:space-between}.context{grid-template-columns:1fr}.param-row,.param-head{grid-template-columns:minmax(100px,1fr) 75px 1fr 1fr 66px;font-size:11px}.param-row input{padding:4px}.brand h1{font-size:16px}.command-dock textarea,.dock-pane pre{height:140px}}
/* 训练结果表在窄窗口内固定布局，长参数自动折行。 */
#training-results{max-width:100%;overflow-x:hidden}
.training-group td{background:#111821;color:#c8d4e0;font-weight:600}.training-group-row{display:flex;align-items:center;gap:8px}.training-group-toggle{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:transparent;border:1px solid transparent;border-radius:7px;padding:6px 8px;cursor:pointer;color:inherit;font:inherit;font-weight:600;text-align:left}.training-group-toggle:hover,.training-group-toggle:focus-visible{border-color:var(--accent);background:#1a2734}.training-chevron{width:0;height:0;border-style:solid;border-width:5px 0 5px 7px;border-color:transparent transparent transparent #8b98a8;transition:transform .15s;flex:0 0 auto}.training-group.open .training-chevron{transform:rotate(90deg)}.training-group-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.training-log-button{float:none;flex:0 0 auto;padding:4px 9px}.training-result td:nth-child(2){color:#9ecbff}
.topbar-control{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;white-space:nowrap}.topbar-control label{font-size:12px;color:var(--muted);font-weight:600}.topbar-control select{width:auto;min-width:92px;padding:5px 7px}.platform-control select{min-width:180px}.language-switch select{min-width:92px}
.runtime-switch{align-self:end;min-height:36px}
.training-log{max-height:360px;overflow:auto;margin:10px 0 0;background:#090d12;border:1px solid #26303a;border-radius:6px;padding:10px;color:#b8d5e8;font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:18px}.modal[hidden]{display:none}.modal-backdrop{position:absolute;inset:0;background:#000b;backdrop-filter:blur(2px)}.modal-card{position:relative;z-index:1;width:min(980px,100%);max-height:min(760px,calc(100vh - 36px));display:flex;flex-direction:column;background:linear-gradient(160deg,#161d27,#131921);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:0 18px 60px #000b}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.modal-head h2{font-size:15px;margin:0}.modal-head button{font-size:20px;line-height:1;padding:4px 9px}.modal-card .training-log{max-height:none;flex:1;min-height:180px;margin:0}
.strategy-combo{position:relative;display:flex;min-width:0}.strategy-combo input{flex:1;min-width:0;padding-right:38px}.strategy-toggle{position:absolute;right:1px;top:1px;bottom:1px;width:32px;border:0;border-left:1px solid var(--border);border-radius:0 5px 5px 0;padding:0;color:var(--muted);background:#151e29}.strategy-toggle:hover{color:var(--text);background:#263a4e}.strategy-menu{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:12;max-height:260px;overflow:auto;background:#101821;border:1px solid var(--accent);border-radius:7px;box-shadow:var(--shadow);padding:4px}.strategy-option,.strategy-empty{display:block;width:100%;padding:7px 9px;border:0;border-radius:5px;text-align:left;background:transparent;color:var(--text);font-size:12px;overflow-wrap:anywhere}.strategy-option{cursor:pointer}.strategy-option:hover,.strategy-option[aria-selected="true"]{background:#1d4057}.strategy-empty{color:var(--muted)}
.result-table{width:100%;table-layout:fixed}
.result-table th,.result-table td{overflow-wrap:anywhere;word-break:break-word;vertical-align:top}
.result-table th:nth-child(1),.result-table td:nth-child(1){width:34px}
.result-table th:nth-child(2),.result-table td:nth-child(2){width:132px}
.result-table th:nth-child(3),.result-table td:nth-child(3){width:82px}
.result-table th:nth-child(4),.result-table td:nth-child(4),.result-table th:nth-child(5),.result-table td:nth-child(5){width:140px}
.result-table .mono{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-all}
@media(max-width:700px){.result-table th,.result-table td{padding:5px;font-size:11px}.result-table th:nth-child(2),.result-table td:nth-child(2){width:88px}.result-table th:nth-child(3),.result-table td:nth-child(3){width:64px}.result-table th:nth-child(4),.result-table td:nth-child(4),.result-table th:nth-child(5),.result-table td:nth-child(5){width:94px}}
@media(max-width:900px){.topbar{flex-wrap:wrap;gap:10px 12px}.brand{flex:1 0 100%;margin-right:0}.platform-control{flex:1 1 220px;min-width:0}.platform-control select{width:100%;min-width:0}.language-switch{flex:1 0 100%;justify-content:flex-end}}
@media(max-width:520px){.topbar{align-items:flex-start;gap:8px}.platform-control{flex-basis:100%}.language-switch{justify-content:space-between}}
.platform-control select{width:150px;min-width:120px}
@media(max-width:900px){.topbar{flex-wrap:wrap;gap:10px 12px}.brand{order:1;flex:1 1 auto;min-width:0;margin-right:0}.platform-control{order:3;flex:1 1 150px;min-width:0}.platform-control select{width:150px;min-width:120px}.status{order:4;flex:0 0 auto}.topbar>#reload-btn{order:5;flex:0 0 auto}.language-switch{order:2;flex:0 0 auto;justify-content:flex-end}}
@media(max-width:520px){.topbar{align-items:flex-start;gap:8px}.brand{flex:1 1 calc(100% - 100px)}.platform-control{flex:1 1 auto}.platform-control select{width:130px;min-width:110px}.language-switch{justify-content:space-between}}
@media(max-width:900px){.topbar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"brand brand language" "platform status reload";align-items:center;gap:10px 12px}.brand{grid-area:brand;display:block;min-width:0;margin:0;flex:none}.platform-control{grid-area:platform;display:flex;flex:none;min-width:0}.platform-control select{width:150px;min-width:120px}.status{grid-area:status;flex:none}.topbar>#reload-btn{grid-area:reload;margin:0;flex:none}.language-switch{grid-area:language;display:flex;flex:none;justify-content:flex-end}}
@media(max-width:520px){.topbar{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand language" "platform platform" "status reload";align-items:start}.platform-control{width:100%}.platform-control select{flex:1;width:auto;min-width:0}.language-switch{justify-self:end}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><h1>QuantAda Command Center</h1></div>
    <div class="topbar-control platform-control"><label for="platform-select">平台 / Shell</label><select id="platform-select"><option value="">自动识别</option><option value="Windows">Windows · PowerShell</option><option value="Linux">Linux · Bash</option><option value="WSL">WSL · Bash</option><option value="Darwin">macOS · Bash</option></select></div>
    <div class="status"><span class="dot" id="status-dot"></span><span id="status-text">正在连接…</span></div>
    <button class="ghost" id="reload-btn" title="重新读取目录和当前状态">↻ 刷新</button>
    <div class="topbar-control language-switch"><label for="language-select">语言</label><select id="language-select" aria-label="界面语言"><option value="zh">中文</option><option value="en">English</option></select></div>
  </header>

  <section class="context">
    <div class="field"><label>方案</label><select id="profile-select"><option value="">新建配置</option></select></div>
    <div class="field"><label>方案别名</label><input id="profile-name" placeholder="例如：CN 趋势回测 v1"></div>
    <div class="field"><label>市场</label><select id="market-select"></select></div>
    <div class="field"><label>策略</label><div class="strategy-combo" id="strategy-combo"><input id="strategy-input" autocomplete="off" placeholder="策略模块路径" title="输入或选择策略" aria-controls="strategy-options" aria-expanded="false"><button type="button" class="strategy-toggle" id="strategy-toggle" title="显示全部策略" aria-label="显示全部策略">⌄</button><div class="strategy-menu" id="strategy-options" role="listbox" hidden></div></div></div>
    <div class="profile-actions"><button class="primary" id="save-profile">保存方案</button><button id="delete-profile" disabled>删除</button><button class="ghost" id="clear-private-credentials" disabled>清除 Futu 解锁凭据</button></div>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="build">命令配置</button>
    <button class="tab" data-tab="params">策略参数</button>
    <button class="tab" data-tab="training">训练工作台</button>
  </nav>

  <main>
    <section class="tab-panel active" id="tab-build">
      <div class="card"><div class="section-head"><h2>运行上下文</h2></div><div class="grid compact">
        <div class="field"><label>数据源</label><input id="data-source-select" list="data-source-list" placeholder="例如 futu gm 或 futu,tiingo"><datalist id="data-source-list"></datalist></div>
        <div class="field"><label>运行模式</label><select id="mode-select"></select></div>
        <div class="field"><label>配置方案</label><select id="config-profile-select"></select></div>
        <div class="field"><label>选股器</label><input id="selection-input" list="selection-list" placeholder="可选模块路径"><datalist id="selection-list"></datalist></div>
        <div class="field"><label>连接 / Broker</label><input id="connect-input" placeholder="例如 gm_broker:sim"></div>
        <div class="field"><label>时间周期</label><input id="timeframe-input" placeholder="例如 1d"></div>
        <div class="field"><label>周期数量</label><input id="compression-input" type="number" min="1" step="1" placeholder="默认 1"></div>
        <div class="field"><label>标的列表</label><input id="symbols-input" placeholder="例如 AAPL,MSFT 或 ['SHSE.600000']"></div>
        <div class="field"><label>起始日期</label><input id="start-date" type="date"></div>
        <div class="field"><label>结束日期</label><input id="end-date" type="date"></div>
        <label class="check runtime-switch"><input type="checkbox" id="print-plan"> 打印交易计划</label>
      </div></div>
      <div class="card"><div class="section-head"><h2>交易与风控</h2></div><div class="grid compact">
        <div class="field"><label>初始资金</label><input id="cash-input" type="number" step="any" placeholder="可选"></div>
        <div class="field"><label>佣金</label><input id="commission-input" type="number" step="any" placeholder="可选"></div>
        <div class="field"><label>滑点</label><input id="slippage-input" type="number" step="any" placeholder="可选"></div>
        <div class="field"><label>风险控制</label><input id="risk-input" placeholder="可选 risk_control"></div>
        <div class="field"><label>风险参数</label><input id="risk-params-input" placeholder="例如 {'stop_loss_pct': 0.05}"></div>
        <div class="field"><label>绘图范围</label><input id="plot-scope-input" placeholder="例如 portfolio_equity"></div>
        <div class="field"><label>优化指标</label><input id="metric-input" placeholder="例如 mix_score_origin"></div>
        <div class="field"><label>训练周期</label><input id="train-roll-period-input" placeholder="例如 3y"></div>
        <div class="field"><label>验证周期</label><input id="test-roll-period-input" placeholder="例如 3m"></div>
        <div class="field"><label>优化次数</label><input id="n-trials-input" type="number" min="1" step="1" placeholder="可选"></div>
        <div class="field"><label>并行任务数</label><input id="n-jobs-input" type="number" step="1" placeholder="默认 -1"></div>
        <div class="field"><label>训练集比例</label><input id="train-ratio-input" type="number" min="0" max="1" step="any" placeholder="例如 0.5"></div>
        <div class="field"><label>训练区间</label><input id="train-period-input" placeholder="例如 20200101:20231231"></div>
        <div class="field"><label>测试区间</label><input id="test-period-input" placeholder="例如 20240101:20241231"></div>
        <label class="check"><input type="checkbox" id="option-portfolio-margin"> 期权组合压力保证金</label>
        <div class="field"><label>期权压力下跌比例</label><input id="option-margin-stress-down-input" type="number" min="0" step="any" placeholder="默认 0.2"></div>
        <div class="field"><label>期权波动率压力</label><input id="option-volatility-shock-input" type="number" min="0" step="any" placeholder="默认 0"></div>
        <div class="field"><label>策略说明</label><input id="desc-input"></div>
      </div><div class="switches" style="margin-top:10px">
        <label class="check"><input type="checkbox" id="no-plot"> 不绘图</label>
        <label class="check"><input type="checkbox" id="refresh"> 刷新数据</label>
        <label class="check"><input type="checkbox" id="strict"> 严格检查缺失变量</label>
      </div></div>
      <div class="card"><div class="section-head"><h2>环境变量</h2><div class="tools"><button id="copy-variables">复制当前变量</button></div></div><div id="variables-editor"></div></div>
    </section>

    <section class="tab-panel" id="tab-params"><div class="card"><div class="section-head"><h2>策略参数</h2><div class="tools"><button id="reset-params" class="ghost">恢复策略默认值</button><button id="copy-params">复制参数</button></div></div><div id="params-editor"></div></div></section>

    <section class="tab-panel" id="tab-training">
      <div class="card"><div class="section-head"><h2>训练源码分析</h2></div><div class="source-row"><div class="field"><label>策略源码</label><input id="source-path" placeholder="例如 strategies/xxx.py"></div><div class="field"><label>外部源码根目录</label><input id="source-root" placeholder="可选，例如 E:\\path\\to\\private-strategies"></div><button id="browse-source">输入路径</button><button id="analyze-source" class="primary">分析超参数</button></div><div id="training-notes" style="margin-top:9px"></div></div>
      <div class="card"><div class="section-head"><h2>推荐训练范围</h2><div class="tools"><button id="apply-ranges" class="primary">应用到当前命令</button><button id="copy-ranges">复制范围</button></div></div><div id="range-editor"><div class="empty">没有可推荐的参数范围</div></div></div>
      <div class="card"><div class="section-head"><h2>训练结果与版本</h2><div class="tools"><button id="refresh-results" class="primary">刷新结果</button><button id="apply-result" disabled>应用选中结果</button></div></div><div id="training-results"><div class="empty">尚未读取训练结果</div></div></div>
    </section>
  </main>

  <section class="command-dock">
    <div class="dock-pane"><h3>生成命令 <button class="ghost" id="copy-command">复制命令</button></h3><textarea id="command-preview" readonly></textarea><div id="warnings"></div></div>
    <div class="dock-pane"><h3>实时结果 <span id="run-meta"></span></h3><pre id="command-result">尚未执行</pre><div class="dock-actions"><button class="success" id="execute-command">执行</button><button class="danger" id="stop-command" disabled>停止</button><button id="copy-result">复制结果</button></div></div>
  </section>
</div>

  function isTrainingGroupOpen(key,containsSelected){const flags=state.training.expanded||{};if(Object.prototype.hasOwnProperty.call(flags,key))return !!flags[key];return !!containsSelected;}
  function renderTrainingResults(){const rs=state.training.results||[];if(!rs.length){state.training.selected=null;$('apply-result').disabled=true;$('training-results').innerHTML=`<div class="empty">${esc(t('尚未读取训练结果'))}</div>`;return} if(state.training.selected===null||!rs[state.training.selected]){const marked=rs.findIndex(r=>r.selected);state.training.selected=marked>=0?marked:null;} $('apply-result').disabled=state.training.selected===null; const groups=new Map();rs.forEach((result,index)=>{const key=trainingResultGroupKey(result);if(!groups.has(key))groups.set(key,[]);groups.get(key).push({result,index});}); const groupEntries=[...groups.entries()]; const body=groupEntries.map(([key,items],groupIndex)=>{const containsSelected=items.some(item=>item.index===state.training.selected);const open=isTrainingGroupOpen(key,containsSelected);const label=trainingResultGroupLabel(items[0].result);const toggleLabel=open?t('折叠本组结果'):t('展开本组结果');const rows=open?items.map(({result,index})=>`<tr class="training-result${state.training.selected===index?' selected':''}"><td><input type="radio" name="training-result" data-result="${index}" ${state.training.selected===index?'checked':''}></td><td>${esc(result.metric||'')}</td><td>${esc(result.score??'')}</td><td>${esc(typeof result.main_eval==='object'?JSON.stringify(result.main_eval):result.main_eval??'')}</td><td>${esc(typeof result.test_set==='object'?JSON.stringify(result.test_set):result.test_set??'')}</td><td class="mono">${esc(JSON.stringify(result.best_params||result.params||{}))}</td></tr>`).join(''):'';return `<tr class="training-group${open?' open':''}"><td colspan="6"><div class="training-group-row"><button type="button" class="training-group-toggle" data-group-index="${groupIndex}" aria-expanded="${open?'true':'false'}" title="${esc(toggleLabel)}" aria-label="${esc(toggleLabel)}"><span class="training-chevron" aria-hidden="true"></span><span class="training-group-title">${esc(label)} · ${items.length} ${esc(t('个结果'))}</span></button><button type="button" class="ghost training-log-button" data-log-result="${esc(items[0].result.result_id)}">${t('查看原始日志')}</button></div></td></tr>`+rows;}).join(''); $('training-results').innerHTML=`<table class="result-table"><thead><tr><th></th><th>${t('指标')}</th><th>${t('分数')}</th><th>MainEval</th><th>TestSet</th><th>${t('参数')}</th></tr></thead><tbody>${body}</tbody></table>`;document.querySelectorAll('[data-result]').forEach(el=>el.addEventListener('change',()=>{state.training.selected=Number(el.dataset.result);const result=state.training.results[state.training.selected];if(result){state.training.expanded=state.training.expanded||{};state.training.expanded[trainingResultGroupKey(result)]=true;}renderTrainingResults();}));document.querySelectorAll('[data-log-result]').forEach(el=>el.addEventListener('click',event=>{event.stopPropagation();viewTrainingLog(el.dataset.logResult);}));document.querySelectorAll('[data-group-index]').forEach(el=>el.addEventListener('click',()=>{const key=groupEntries[Number(el.dataset.groupIndex)]?.[0];if(!key)return;const items=groups.get(key)||[];const containsSelected=items.some(item=>item.index===state.training.selected);state.training.expanded=state.training.expanded||{};state.training.expanded[key]=!isTrainingGroupOpen(key,containsSelected);renderTrainingResults();}));}
  function closeTrainingLog(){const modal=$('training-log-modal');if(modal)modal.hidden=true;}
  async function viewTrainingLog(resultId){const modal=$('training-log-modal'),content=$('training-log-content'),path=$('training-log-path');if(!modal||!content||!resultId)return;modal.hidden=false;resetFollowTail(content);setFollowText(content,t('正在读取日志…'));path.textContent='';try{const data=await api('/api/training/log',{method:'POST',body:JSON.stringify({result_id:resultId})});path.textContent=data.path||'';setFollowText(content,data.marker_found?(data.content||'')+(data.truncated?'\n\n'+t('日志过长，已截断'):''):data.snapshot?JSON.stringify(data.snapshot,null,2):t('未找到AI辅助分析日志'));}catch(err){setFollowText(content,t(err.message));}}
  async function applyResult(){const r=state.training.results[state.training.selected];if(!r)return;state.form.params={...(r.best_params||r.params||{})};renderParams();refreshCommand();toast('已将训练结果参数应用到当前命令');}
  async function copyText(value){try{await navigator.clipboard.writeText(value);toast('已复制到剪贴板')}catch{const ta=document.createElement('textarea');ta.value=value;document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();toast('已复制到剪贴板')}}
  function normalizeDateInputs(){ ['start_date','end_date'].forEach(k=>{const el=$(k.replace('_','-'));const value=state.form.options?.[k];if(el&&document.activeElement!==el&&/^\d{8}$/.test(String(value||'')))el.value=`${String(value).slice(0,4)}-${String(value).slice(4,6)}-${String(value).slice(6,8)}`;}); }
  const _refreshCommand=refreshCommand;
  refreshCommand=()=>{normalizeDateInputs();_refreshCommand();};
  function bindExtraInputs(){ ['compression-input','risk-params-input','plot-scope-input','metric-input','train-roll-period-input','test-roll-period-input','n-trials-input','n-jobs-input','train-ratio-input','train-period-input','test-period-input'].forEach(id=>$(id)?.addEventListener('input',refreshCommand)); }
  function bindLanguage(){ const el=$('language-select'); if(!el)return; el.value=language; el.addEventListener('change',()=>{language=el.value==='en'?'en':'zh';try{localStorage.setItem('quantada.ui.language',language)}catch{} applyI18n();renderProfiles();renderStrategyOptions();renderVariables();renderParams();renderRanges();renderTrainingResults();refreshCommand();}); }
  function bindStrategyCombo(){ const combo=$('strategy-combo'),input=$('strategy-input'),toggle=$('strategy-toggle'),menu=$('strategy-options'); if(!combo||!input||!toggle||!menu)return; input.addEventListener('focus',()=>openStrategyOptions(false)); input.addEventListener('input',()=>{strategyShowAll=false;if(strategyMenuOpen)renderStrategyOptions();}); toggle.addEventListener('mousedown',event=>event.preventDefault()); toggle.addEventListener('click',()=>openStrategyOptions(true)); menu.addEventListener('mousedown',event=>event.preventDefault()); menu.addEventListener('click',event=>{const option=event.target.closest('[data-strategy-value]');if(option)chooseStrategy(option.dataset.strategyValue);}); document.addEventListener('click',event=>{if(!combo.contains(event.target))closeStrategyOptions();}); }
  bindLanguage(); applyI18n(); bind(); bindStrategyCombo(); bindExtraInputs();
  $('source-root')?.addEventListener('input',()=>{state.source_root=$('source-root').value;refreshCommand();});
  $('profile-select')?.addEventListener('change',()=>{const selected=state.profiles.find(x=>(x.profile_id||x.id||x.preset_id)===$('profile-select').value);if(selected&&$('source-root')){state.source_root=selected.source_root||'';$('source-root').value=state.source_root;refreshCommand();}});
  load();
})();
</script>
